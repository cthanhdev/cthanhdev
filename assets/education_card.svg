<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 265" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#0a0e14" />
    </linearGradient>

    <!-- Sub-card Gradient -->
    <linearGradient id="subcard-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0e131a" />
    </linearGradient>

    <!-- GPA Progress Bar Gradient -->
    <linearGradient id="gpa-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- Subtle border glow filter -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'SFMono-Regular', Consolas, 'Courier New', Courier, monospace; }
  </style>

  <!-- Outer Card Frame -->
  <rect x="2" y="2" width="756" height="261" rx="14" fill="url(#card-bg)" stroke="#30363d" stroke-width="1.2" />

  <!-- ================= HEADER SECTION ================= -->
  <!-- University Logo Badge (HCMCOU) -->
  <g transform="translate(32, 22)">
    <!-- Logo Circle -->
    <circle cx="24" cy="24" r="23" fill="#0054a6" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="24" cy="24" r="20" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.4" />
    
    <!-- Stylized OU Symbol -->
    <!-- Open Book / Wings "U" -->
    <path d="M 12 28 C 16 23, 22 25, 24 29 C 26 25, 32 23, 36 28 C 34 32, 26 31, 24 33 C 22 31, 14 32, 12 28 Z" fill="#ffffff" />
    <!-- Ellipse "O" -->
    <ellipse cx="24" cy="18" rx="8" ry="6" fill="none" stroke="#ffffff" stroke-width="2.2" />
    <!-- Small star or emblem center -->
    <circle cx="24" cy="18" r="2" fill="#38bdf8" />
    <!-- Lettering OU -->
    <text x="24" y="38" font-family="'Segoe UI', Arial, sans-serif" font-size="7" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">HCMCOU</text>
  </g>

  <!-- Student Name & University Affiliation -->
  <g transform="translate(92, 22)" class="font-sans">
    <text x="0" y="22" font-size="22" font-weight="800" fill="#f0f6fc" letter-spacing="0.3">
      Phi Cong Thanh
    </text>
    <text x="0" y="40" font-size="12" font-weight="500" fill="#8b949e">
      Information Technology Student @ Ho Chi Minh City Open University (HCMCOU)
    </text>
  </g>

  <!-- Divider Line -->
  <line x1="32" y1="80" x2="728" y2="80" stroke="#21262d" stroke-width="1" />

  <!-- ================= LEFT COLUMN: DETAILS ================= -->
  <g transform="translate(32, 88)" class="font-sans">
    <!-- University -->
    <text x="0" y="16" font-size="9" font-weight="700" fill="#8b949e" letter-spacing="1.2">UNIVERSITY</text>
    <text x="0" y="34" font-size="13" font-weight="600" fill="#e6edf3">Ho Chi Minh City Open University (HCMCOU)</text>

    <!-- Major & Track -->
    <text x="0" y="58" font-size="9" font-weight="700" fill="#8b949e" letter-spacing="1.2">MAJOR &amp; CLASS</text>
    <text x="0" y="76" font-size="13" font-weight="600" fill="#e6edf3">
      Information Technology <tspan fill="#8b949e">•</tspan> Class DH25IT02
    </text>

    <!-- Cohort & Program -->
    <text x="0" y="100" font-size="9" font-weight="700" fill="#8b949e" letter-spacing="1.2">COHORT &amp; DEGREE</text>
    <text x="0" y="118" font-size="13" font-weight="600" fill="#e6edf3">
      2025 – 2029 <tspan fill="#8b949e">•</tspan> Regular Undergraduate Program
    </text>

    <!-- Career Goals & Focus Badges -->
    <text x="0" y="140" font-size="9" font-weight="700" fill="#8b949e" letter-spacing="1.2">CAREER GOALS &amp; FOCUS</text>
    
    <g transform="translate(0, 146)" class="font-mono" font-size="9" font-weight="600">
      <!-- Badge 1: Backend -->
      <g transform="translate(0, 0)">
        <rect width="68" height="20" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1" />
        <text x="34" y="13" fill="#58a6ff" text-anchor="middle">BACKEND</text>
      </g>
      <!-- Badge 2: Data Engineer -->
      <g transform="translate(74, 0)">
        <rect width="106" height="20" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1" />
        <text x="53" y="13" fill="#3fb950" text-anchor="middle">DATA ENGINEER</text>
      </g>
      <!-- Badge 3: DevOps -->
      <g transform="translate(186, 0)">
        <rect width="64" height="20" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1" />
        <text x="32" y="13" fill="#bc8cff" text-anchor="middle">DEVOPS</text>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: GPA SUB-CARD ================= -->
  <g transform="translate(460, 94)">
    <!-- Sub-card background -->
    <rect width="268" height="152" rx="10" fill="url(#subcard-bg)" stroke="#30363d" stroke-width="1" />

    <!-- Top Label Row -->
    <text x="18" y="24" class="font-sans" font-size="10" font-weight="700" fill="#8b949e" letter-spacing="1">CURRENT GPA</text>
    <text x="250" y="24" class="font-sans" font-size="10" font-weight="700" fill="#8b949e" letter-spacing="1" text-anchor="end">SCALE: 4.0</text>

    <!-- GPA Score & Percentage -->
    <g transform="translate(18, 64)" class="font-sans">
      <text x="0" y="0" font-size="36" font-weight="800" fill="#f0f6fc">2.67</text>
      <text x="76" y="-3" font-size="16" font-weight="600" fill="#8b949e">/ 4.0</text>
      <text x="232" y="-3" font-size="14" font-weight="700" fill="#58a6ff" text-anchor="end">66.75%</text>
    </g>

    <!-- Progress Bar Track -->
    <g transform="translate(18, 80)">
      <!-- Background track -->
      <rect width="232" height="8" rx="4" fill="#21262d" />
      <!-- Filled Progress: 232 * (2.67 / 4.0) = 154.86 px -->
      <rect width="155" height="8" rx="4" fill="url(#gpa-grad)" filter="url(#glow)" />
    </g>

    <!-- Scale numbers -->
    <text x="18" y="104" class="font-mono" font-size="9" fill="#6e7681">0.0</text>
    <text x="250" y="104" class="font-mono" font-size="9" fill="#6e7681" text-anchor="end">4.0</text>

    <!-- Footer Tag: Credits Accumulation -->
    <line x1="18" y1="116" x2="250" y2="116" stroke="#21262d" stroke-width="1" stroke-dasharray="3 3" />
    <text x="134" y="136" class="font-sans" font-size="9" font-weight="700" fill="#8b949e" letter-spacing="1" text-anchor="middle">
      CREDITS: 42 <tspan fill="#484f58">•</tspan> REGULAR PROGRAM
    </text>
  </g>
</svg>
