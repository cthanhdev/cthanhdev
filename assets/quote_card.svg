<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="quote-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="quote-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Text Glow Filter -->
    <filter id="quote-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="quote-dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#334155" opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .font-quote { font-family: 'Georgia', serif; font-style: italic; }
    .font-author { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; }
    .font-mono { font-family: 'Courier New', Courier, monospace; }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="756" height="156" rx="12" fill="url(#quote-bg)" />
  <rect x="2" y="2" width="756" height="156" rx="12" fill="url(#quote-dots)" />

  <!-- Neon Border -->
  <rect x="2" y="2" width="756" height="156" rx="12" fill="none" stroke="url(#quote-border)" stroke-width="1.5" opacity="0.85" />
  <rect x="6" y="6" width="748" height="148" rx="9" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="6 4" opacity="0.5" />

  <!-- Big Decorative Quotation Mark -->
  <text x="35" y="75" font-family="'Georgia', serif" font-size="80" fill="#38bdf8" opacity="0.18">“</text>

  <!-- Quote Content -->
  <g transform="translate(65, 42)">
    <!-- Terminal tag badge -->
    <rect x="0" y="0" width="105" height="18" rx="3" fill="#1e1b4b" stroke="#4f46e5" stroke-width="0.8" />
    <text x="52" y="13" class="font-mono" font-size="10" fill="#a5b4fc" text-anchor="middle">&gt; kernel.log</text>

    <!-- Main Quote -->
    <text x="0" y="46" class="font-quote" font-size="22" fill="#38bdf8" filter="url(#quote-glow)">
      “Talk is cheap. Show me the code.”
    </text>

    <!-- Author & Attribution -->
    <g transform="translate(0, 78)">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#00f2fe" stroke-width="2" />
      <text x="40" y="4" class="font-author" font-size="14" fill="#f1f5f9">
        Linus Torvalds
      </text>
      <text x="165" y="4" class="font-mono" font-size="12" fill="#64748b">
        — Creator of Linux &amp; Git
      </text>
    </g>
  </g>

  <!-- Right Side Minimalist Terminal Icon / Accent -->
  <g transform="translate(685, 30)" opacity="0.7">
    <circle cx="20" cy="20" r="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="20" y="25" class="font-mono" font-size="14" fill="#38bdf8" text-anchor="middle" font-weight="bold">&lt;/&gt;</text>
  </g>
</svg>
