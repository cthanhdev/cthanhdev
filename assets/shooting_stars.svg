<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="35%" stop-color="#0a1226" />
      <stop offset="70%" stop-color="#0f1f3d" />
      <stop offset="100%" stop-color="#050914" />
    </linearGradient>

    <!-- Nebula Glow Gradients -->
    <radialGradient id="nebula1" cx="20%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#1e1b4b" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#040711" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebula2" cx="80%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#040711" stop-opacity="0" />
    </radialGradient>

    <!-- Meteor Trail Gradient -->
    <linearGradient id="meteorTail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="90%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Text Glow Filter -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur" />
      <feFlood flood-color="#38bdf8" flood-opacity="0.5" result="flood" />
      <feComposite in="flood" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Static Star Twinkle */
    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .star {
      transform-box: fill-box;
      transform-origin: center;
      animation: twinkle 3s ease-in-out infinite;
    }
    .star-d1 { animation-delay: 0.4s; animation-duration: 2.2s; }
    .star-d2 { animation-delay: 1.1s; animation-duration: 3.5s; }
    .star-d3 { animation-delay: 1.8s; animation-duration: 2.8s; }
    .star-d4 { animation-delay: 2.3s; animation-duration: 4s; }

    /* Shooting Stars Animation */
    @keyframes meteor {
      0% {
        transform: translate(0px, 0px) rotate(-35deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      65% {
        opacity: 1;
      }
      100% {
        transform: translate(-700px, 490px) rotate(-35deg);
        opacity: 0;
      }
    }

    .meteor-item {
      position: absolute;
      transform-origin: center;
      opacity: 0;
      animation: meteor linear infinite;
    }

    .m1  { animation-duration: 2.6s; animation-delay: 0.2s; }
    .m2  { animation-duration: 3.2s; animation-delay: 1.5s; }
    .m3  { animation-duration: 2.8s; animation-delay: 3.1s; }
    .m4  { animation-duration: 3.6s; animation-delay: 0.8s; }
    .m5  { animation-duration: 2.4s; animation-delay: 4.2s; }
    .m6  { animation-duration: 3.0s; animation-delay: 2.3s; }
    .m7  { animation-duration: 2.7s; animation-delay: 5.0s; }
    .m8  { animation-duration: 3.4s; animation-delay: 3.7s; }

    /* Pulse Glow for Badge */
    @keyframes pulseBadge {
      0%, 100% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 1; filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.8)); }
    }
    .badge-border {
      animation: pulseBadge 3s ease-in-out infinite;
    }
  </style>

  <!-- Deep Cosmos Base -->
  <rect width="1200" height="320" fill="url(#bgGrad)" />
  <rect width="1200" height="320" fill="url(#nebula1)" />
  <rect width="1200" height="320" fill="url(#nebula2)" />

  <!-- Twinkling Stars Background Grid -->
  <g fill="#ffffff">
    <circle cx="45" cy="40" r="1" class="star star-d1" opacity="0.6" />
    <circle cx="110" cy="95" r="1.5" class="star star-d2" opacity="0.8" />
    <circle cx="180" cy="30" r="1" class="star star-d3" opacity="0.5" />
    <circle cx="230" cy="140" r="2" class="star star-d4" opacity="0.9" />
    <circle cx="290" cy="70" r="1" class="star star-d1" opacity="0.4" />
    <circle cx="340" cy="190" r="1.5" class="star star-d2" opacity="0.7" />
    <circle cx="410" cy="50" r="1" class="star star-d3" opacity="0.6" />
    <circle cx="480" cy="110" r="2" class="star star-d4" opacity="0.8" />
    <circle cx="530" cy="35" r="1.5" class="star star-d1" opacity="0.7" />
    <circle cx="610" cy="80" r="1" class="star star-d2" opacity="0.5" />
    <circle cx="670" cy="160" r="2" class="star star-d3" opacity="0.9" />
    <circle cx="730" cy="45" r="1" class="star star-d4" opacity="0.4" />
    <circle cx="810" cy="120" r="1.5" class="star star-d1" opacity="0.8" />
    <circle cx="870" cy="65" r="1" class="star star-d2" opacity="0.5" />
    <circle cx="940" cy="145" r="2" class="star star-d3" opacity="0.9" />
    <circle cx="990" cy="40" r="1.5" class="star star-d4" opacity="0.7" />
    <circle cx="1060" cy="90" r="1" class="star star-d1" opacity="0.5" />
    <circle cx="1130" cy="170" r="2" class="star star-d2" opacity="0.8" />
    <circle cx="1170" cy="55" r="1" class="star star-d3" opacity="0.6" />

    <circle cx="80" cy="240" r="1.5" class="star star-d4" opacity="0.7" />
    <circle cx="150" cy="280" r="1" class="star star-d1" opacity="0.5" />
    <circle cx="260" cy="230" r="2" class="star star-d2" opacity="0.8" />
    <circle cx="390" cy="270" r="1" class="star star-d3" opacity="0.6" />
    <circle cx="520" cy="250" r="1.5" class="star star-d4" opacity="0.7" />
    <circle cx="680" cy="275" r="1" class="star star-d1" opacity="0.5" />
    <circle cx="840" cy="240" r="2" class="star star-d2" opacity="0.9" />
    <circle cx="960" cy="285" r="1.5" class="star star-d3" opacity="0.7" />
    <circle cx="1090" cy="260" r="1" class="star star-d4" opacity="0.6" />
  </g>

  <!-- Shooting Stars (Meteors) Layer -->
  <g class="meteor-item m1" transform="translate(1150, -40)">
    <line x1="0" y1="0" x2="160" y2="0" stroke="url(#meteorTail)" stroke-width="2.2" filter="url(#glow)" />
    <circle cx="160" cy="0" r="2.8" fill="#ffffff" filter="url(#glow)" />
  </g>
  <g class="meteor-item m2" transform="translate(900, -50)">
    <line x1="0" y1="0" x2="200" y2="0" stroke="url(#meteorTail)" stroke-width="2.6" filter="url(#glow)" />
    <circle cx="200" cy="0" r="3.2" fill="#ffffff" filter="url(#glow)" />
  </g>
  <g class="meteor-item m3" transform="translate(650, -60)">
    <line x1="0" y1="0" x2="140" y2="0" stroke="url(#meteorTail)" stroke-width="1.8" filter="url(#glow)" />
    <circle cx="140" cy="0" r="2.2" fill="#ffffff" filter="url(#glow)" />
  </g>
  <g class="meteor-item m4" transform="translate(1300, 30)">
    <line x1="0" y1="0" x2="180" y2="0" stroke="url(#meteorTail)" stroke-width="2.4" filter="url(#glow)" />
    <circle cx="180" cy="0" r="3.0" fill="#ffffff" filter="url(#glow)" />
  </g>
  <g class="meteor-item m5" transform="translate(450, -40)">
    <line x1="0" y1="0" x2="150" y2="0" stroke="url(#meteorTail)" stroke-width="2.0" filter="url(#glow)" />
    <circle cx="150" cy="0" r="2.5" fill="#ffffff" filter="url(#glow)" />
  </g>
  <g class="meteor-item m6" transform="translate(800, -30)">
    <line x1="0" y1="0" x2="170" y2="0" stroke="url(#meteorTail)" stroke-width="2.3" filter="url(#glow)" />
    <circle cx="170" cy="0" r="2.8" fill="#ffffff" filter="url(#glow)" />
  </g>
  <g class="meteor-item m7" transform="translate(1000, 50)">
    <line x1="0" y1="0" x2="130" y2="0" stroke="url(#meteorTail)" stroke-width="1.8" filter="url(#glow)" />
    <circle cx="130" cy="0" r="2.2" fill="#ffffff" filter="url(#glow)" />
  </g>
  <g class="meteor-item m8" transform="translate(350, -30)">
    <line x1="0" y1="0" x2="190" y2="0" stroke="url(#meteorTail)" stroke-width="2.5" filter="url(#glow)" />
    <circle cx="190" cy="0" r="3.0" fill="#ffffff" filter="url(#glow)" />
  </g>

  <!-- Central Visual Branding / Title -->
  <g text-anchor="middle">
    <!-- Sub-badge: BACKEND ENGINEER -->
    <g transform="translate(600, 72)">
      <rect x="-115" y="-16" width="230" height="32" rx="16" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.5" class="badge-border" />
      <circle cx="-85" cy="0" r="4" fill="#38bdf8" />
      <text x="8" y="5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="3">BACKEND ENGINEER</text>
    </g>

    <!-- Main Title: PHI CONG THANH -->
    <text x="600" y="148" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="4" filter="url(#textGlow)">
      PHI CONG THANH
    </text>

    <!-- Secondary Line -->
    <text x="600" y="192" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" letter-spacing="2">
      High-Performance Systems • Database Architecture • Scalable Solutions
    </text>

    <!-- Academic Tag -->
    <g transform="translate(600, 238)">
      <rect x="-190" y="-15" width="380" height="30" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1" />
      <text x="0" y="5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600">
        🏛️ Ho Chi Minh City Open University (HCMCOU)
      </text>
    </g>
  </g>

  <!-- Bottom Accent Cosmic Border Line -->
  <line x1="0" y1="318" x2="1200" y2="318" stroke="url(#meteorTail)" stroke-width="2" opacity="0.6" />
</svg>