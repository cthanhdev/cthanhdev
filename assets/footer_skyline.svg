<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 120" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="60%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="f-blur">
      <feGaussianBlur stdDeviation="2" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="920" height="120" rx="8" fill="url(#footer-bg)" />

  <!-- Neon Top Border Line -->
  <line x1="0" y1="1" x2="920" y2="1" stroke="url(#neon-glow)" stroke-width="2" opacity="0.85" />
  <line x1="0" y1="2" x2="920" y2="2" stroke="url(#neon-glow)" stroke-width="4" opacity="0.3" filter="url(#f-blur)" />

  <!-- Stars -->
  <g fill="#94a3b8" opacity="0.5">
    <circle cx="50" cy="20" r="1" />
    <circle cx="120" cy="35" r="1.5" />
    <circle cx="210" cy="15" r="1" />
    <circle cx="310" cy="28" r="1.5" />
    <circle cx="430" cy="18" r="1" />
    <circle cx="540" cy="25" r="1.5" />
    <circle cx="650" cy="12" r="1" />
    <circle cx="740" cy="30" r="1.5" />
    <circle cx="850" cy="15" r="1" />
  </g>

  <!-- Distant Silhouette Layer -->
  <g fill="#111827" opacity="0.7">
    <rect x="20" y="45" width="40" height="75" />
    <rect x="70" y="35" width="55" height="85" />
    <polygon points="97,20 85,35 110,35" />
    <rect x="135" y="50" width="35" height="70" />
    <rect x="180" y="30" width="60" height="90" />
    <rect x="250" y="40" width="45" height="80" />
    <rect x="305" y="55" width="50" height="65" />
    <rect x="365" y="25" width="55" height="95" />
    <rect x="430" y="45" width="40" height="75" />
    <rect x="480" y="30" width="60" height="90" />
    <polygon points="510,15 500,30 520,30" />
    <rect x="550" y="50" width="45" height="70" />
    <rect x="605" y="35" width="50" height="85" />
    <rect x="665" y="40" width="40" height="80" />
    <rect x="715" y="25" width="55" height="95" />
    <rect x="780" y="45" width="45" height="75" />
    <rect x="835" y="35" width="65" height="85" />
  </g>

  <!-- Foreground Skyline Layer -->
  <g fill="#070a12">
    <rect x="0" y="70" width="35" height="50" />
    <rect x="40" y="55" width="45" height="65" />
    <rect x="95" y="65" width="40" height="55" />
    <rect x="145" y="45" width="50" height="75" />
    <rect x="205" y="60" width="40" height="60" />
    <rect x="255" y="50" width="65" height="70" />
    <rect x="330" y="65" width="45" height="55" />
    <rect x="385" y="40" width="50" height="80" />
    <rect x="445" y="58" width="55" height="62" />
    <rect x="510" y="48" width="45" height="72" />
    <rect x="565" y="62" width="50" height="58" />
    <rect x="625" y="42" width="55" height="78" />
    <rect x="690" y="55" width="40" height="65" />
    <rect x="740" y="60" width="50" height="60" />
    <rect x="800" y="45" width="55" height="75" />
    <rect x="865" y="58" width="55" height="62" />
  </g>

  <!-- Building Windows (Neon Cyber Glow) -->
  <g fill="#38bdf8" opacity="0.8">
    <rect x="50" y="65" width="3" height="4" />
    <rect x="62" y="65" width="3" height="4" />
    <rect x="50" y="75" width="3" height="4" />
    <rect x="74" y="80" width="3" height="4" fill="#fbbf24" />
    
    <rect x="155" y="55" width="4" height="4" />
    <rect x="170" y="55" width="4" height="4" fill="#f43f5e" />
    <rect x="155" y="70" width="4" height="4" />
    <rect x="180" y="70" width="4" height="4" />

    <rect x="270" y="60" width="3" height="4" />
    <rect x="285" y="60" width="3" height="4" fill="#a855f7" />
    <rect x="300" y="75" width="3" height="4" />

    <rect x="395" y="50" width="4" height="5" />
    <rect x="410" y="50" width="4" height="5" />
    <rect x="395" y="65" width="4" height="5" fill="#34d399" />
    <rect x="420" y="65" width="4" height="5" />

    <rect x="520" y="58" width="3" height="4" />
    <rect x="535" y="58" width="3" height="4" />
    <rect x="520" y="72" width="3" height="4" fill="#f59e0b" />

    <rect x="635" y="52" width="4" height="5" />
    <rect x="655" y="52" width="4" height="5" fill="#ec4899" />
    <rect x="635" y="68" width="4" height="5" />

    <rect x="815" y="55" width="3" height="4" />
    <rect x="830" y="55" width="3" height="4" />
    <rect x="840" y="70" width="3" height="4" fill="#38bdf8" />
  </g>

  <!-- Center Text Motto -->
  <text x="460" y="105" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" fill="#64748b" letter-spacing="2">
    &lt; KEEP LEARNING • KEEP CODING • CONTINUOUS IMPROVEMENT /&gt;
  </text>
</svg>
