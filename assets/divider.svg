<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 20" width="100%" height="20">
  <defs>
    <linearGradient id="appleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2997FF" stop-opacity="0" />
      <stop offset="35%" stop-color="#2997FF" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#F5F5F7" stop-opacity="0.7" />
      <stop offset="65%" stop-color="#2997FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#2997FF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="hairline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2C2C2E" stop-opacity="0" />
      <stop offset="15%" stop-color="#2C2C2E" stop-opacity="0.8" />
      <stop offset="85%" stop-color="#2C2C2E" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2C2C2E" stop-opacity="0" />
    </linearGradient>
    <style>
      .shimmer {
        animation: appleShimmer 8s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      }
      @keyframes appleShimmer {
        0%, 15% { transform: translateX(-350px); opacity: 0; }
        25% { opacity: 0.85; }
        60% { opacity: 0.85; }
        70%, 100% { transform: translateX(950px); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .shimmer { animation: none; opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background Base: Pure Apple Dark -->
  <rect width="900" height="20" fill="transparent" />

  <!-- Base Precision Hairline -->
  <line x1="30" y1="10" x2="870" y2="10" stroke="url(#hairline)" stroke-width="1" />

  <!-- Apple Subtle Light Shimmer -->
  <g class="shimmer">
    <rect x="0" y="9" width="300" height="2" fill="url(#appleGlow)" />
  </g>

  <!-- Center Subtle Anchor Dot -->
  <circle cx="450" cy="10" r="1.5" fill="#86868B" opacity="0.6" />
</svg>
