<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 54" width="100%" height="54">
  <defs>
    <linearGradient id="specularEdu" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="20%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="80%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="appleBlueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .pulse-dot {
        animation: applePulse 3.6s ease-in-out infinite;
      }
      @keyframes applePulse {
        0%, 100% { opacity: 0.7; transform: scale(0.95); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse-dot { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="54" fill="transparent" />

  <!-- Apple Frosted Glass Plate -->
  <rect x="10" y="6" width="880" height="42" rx="14" fill="#161618" stroke="#2C2C2E" stroke-width="1" />

  <!-- Top Specular Catch (Apple Material Reflection) -->
  <line x1="28" y1="7" x2="872" y2="7" stroke="url(#specularEdu)" stroke-width="1" stroke-linecap="round" />

  <!-- Left Accent Orb: Apple System Blue -->
  <g transform="translate(28, 27)">
    <circle cx="0" cy="0" r="4" fill="#2997FF" filter="url(#appleBlueGlow)" class="pulse-dot" />
  </g>

  <!-- Category Eyebrow -->
  <text x="44" y="22" fill="#86868B" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" letter-spacing="1.8">ACADEMIC BACKGROUND</text>

  <!-- Main Section Heading -->
  <text x="44" y="38" fill="#F5F5F7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" letter-spacing="-0.3">Education &amp; Credentials</text>

  <!-- Right Pill Badge: Apple Glass Capsule -->
  <g transform="translate(710, 15)">
    <rect width="162" height="24" rx="12" fill="#202024" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <circle cx="14" cy="12" r="3" fill="#2997FF" />
    <text x="25" y="15.5" fill="#A1A1A6" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500">HCMCOU • 2025–2029</text>
  </g>
</svg>
