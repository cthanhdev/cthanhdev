<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 48" width="100%" height="48">
  <defs>
    <style>
      .hud-bracket {
        animation: bracketPulse 3.5s ease-in-out infinite;
      }
      .hud-line {
        stroke-dasharray: 600;
        stroke-dashoffset: 0;
        animation: lineDraw 5s ease-in-out infinite alternate;
      }
      .amber-pip {
        animation: blinkAmber 2.8s ease-in-out infinite;
      }
      @keyframes bracketPulse {
        0%, 100% { stroke: #8FA0B0; stroke-opacity: 0.4; }
        50% { stroke: #CDD5E0; stroke-opacity: 0.95; }
      }
      @keyframes lineDraw {
        0% { stroke-dashoffset: 80; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes blinkAmber {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .hud-bracket { animation: none; stroke: #8FA0B0; stroke-opacity: 0.7; }
        .hud-line { animation: none; stroke-dashoffset: 0; }
        .amber-pip { animation: none; opacity: 0.9; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="48" fill="#161C24" />

  <!-- Main System Header Plate -->
  <rect x="10" y="6" width="880" height="36" rx="4" fill="#1C232D" stroke="#2E3946" stroke-width="1.2" />

  <!-- Tactical Corner Brackets (HUD Reticle) -->
  <path d="M 16,16 L 16,11 L 21,11" fill="none" stroke-width="1.5" class="hud-bracket" />
  <path d="M 884,16 L 884,11 L 879,11" fill="none" stroke-width="1.5" class="hud-bracket" />
  <path d="M 16,32 L 16,37 L 21,37" fill="none" stroke-width="1.5" class="hud-bracket" />
  <path d="M 884,32 L 884,37 L 879,37" fill="none" stroke-width="1.5" class="hud-bracket" />

  <!-- Warning / Status Indicator Pip (Under 5% amber) -->
  <rect x="28" y="21" width="6" height="6" fill="#D98E32" class="amber-pip" />

  <!-- Section Label -->
  <text x="44" y="28.5" fill="#CDD5E0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.5">PILOT PROFILE // EDUCATION</text>

  <!-- Secondary Classification Meta -->
  <text x="44" y="15" fill="#8FA0B0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" font-weight="600" letter-spacing="1">SYSTEM CLASSIFICATION: ACADEMIC CREDENTIALS</text>

  <!-- Dynamic Underline -->
  <line x1="280" y1="24" x2="800" y2="24" stroke="#2E3946" stroke-width="1" class="hud-line" />

  <!-- Tactical Hex / Station Stamp -->
  <text x="860" y="27" text-anchor="end" fill="#8FA0B0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="600" letter-spacing="1">LOG.01 // HCMCOU</text>
</svg>
