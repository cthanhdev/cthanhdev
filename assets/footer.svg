<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" width="100%" height="110">
  <defs>
    <linearGradient id="laserSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8FA0B0" stop-opacity="0" />
      <stop offset="50%" stop-color="#CDD5E0" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#8FA0B0" stop-opacity="0" />
    </linearGradient>
    <style>
      .laser-sweep {
        animation: sweepMotion 6.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .hud-bracket {
        animation: bracketPulse 3.5s ease-in-out infinite;
      }
      .amber-pip {
        animation: pipBlink 3s ease-in-out infinite;
      }
      @keyframes sweepMotion {
        0% { transform: translateX(-300px); }
        100% { transform: translateX(1200px); }
      }
      @keyframes bracketPulse {
        0%, 100% { stroke: #8FA0B0; stroke-opacity: 0.4; }
        50% { stroke: #CDD5E0; stroke-opacity: 0.95; }
      }
      @keyframes pipBlink {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .laser-sweep { animation: none; transform: translateX(350px); opacity: 0.3; }
        .hud-bracket { animation: none; stroke: #8FA0B0; stroke-opacity: 0.6; }
        .amber-pip { animation: none; opacity: 0.8; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="110" fill="#161C24" />

  <!-- Inner HUD Panel -->
  <rect x="15" y="10" width="870" height="90" rx="4" fill="#1C232D" stroke="#2E3946" stroke-width="1.2" />

  <!-- Corner Brackets -->
  <path d="M 22,22 L 22,16 L 28,16" fill="none" stroke-width="1.5" class="hud-bracket" />
  <path d="M 878,22 L 878,16 L 872,16" fill="none" stroke-width="1.5" class="hud-bracket" />
  <path d="M 22,88 L 22,94 L 28,94" fill="none" stroke-width="1.5" class="hud-bracket" />
  <path d="M 878,88 L 878,94 L 872,94" fill="none" stroke-width="1.5" class="hud-bracket" />

  <!-- Top Laser Sweep Line -->
  <line x1="20" y1="10" x2="880" y2="10" stroke="#2E3946" stroke-width="1.2" />
  <g class="laser-sweep">
    <rect x="0" y="9" width="240" height="2" fill="url(#laserSweep)" />
  </g>

  <!-- Status / Channel Indicator -->
  <rect x="34" y="26" width="5" height="5" fill="#D98E32" class="amber-pip" />
  <text x="46" y="31" fill="#8FA0B0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" font-weight="600" letter-spacing="1.5">TRANSMISSION // TOKYO-3 HUD FREQUENCY 108.4</text>

  <!-- Quote Line 1 & 2 -->
  <text x="450" y="56" text-anchor="middle" fill="#CDD5E0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-style="normal" letter-spacing="0.4">
    &quot;Man fears the darkness, and so he scrapes away at the edges of it with fire.
  </text>
  <text x="450" y="74" text-anchor="middle" fill="#CDD5E0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-style="normal" letter-spacing="0.4">
    He creates life by diminishing the darkness.&quot;
  </text>

  <!-- Origin Stamp -->
  <text x="450" y="91" text-anchor="middle" fill="#8FA0B0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="700" letter-spacing="2">
    — NEON GENESIS EVANGELION // TERMINAL LOG —
  </text>
</svg>
