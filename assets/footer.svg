<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 90" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Exact Color Palette Extracted from 1305986.png -->
    <linearGradient id="footerBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101419" />
      <stop offset="50%" stop-color="#1c232d" />
      <stop offset="100%" stop-color="#101419" />
    </linearGradient>

    <!-- Mist & Steel Laser Line -->
    <linearGradient id="steelLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8fa0b0" stop-opacity="0" />
      <stop offset="25%" stop-color="#8fa0b0" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#cdd5e0" stop-opacity="1" />
      <stop offset="75%" stop-color="#8fa0b0" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8fa0b0" stop-opacity="0" />
    </linearGradient>

    <filter id="laserGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes laserPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.95; filter: drop-shadow(0 0 6px rgba(143, 160, 176, 0.7)); }
    }
    .laser-line {
      animation: laserPulse 3s ease-in-out infinite;
    }
  </style>

  <!-- Background Base (Deep Frame Slate) -->
  <rect width="1200" height="90" fill="url(#footerBgGrad)" />

  <!-- Top Accent Laser Line (Atmospheric Steel Mist Glow) -->
  <line x1="0" y1="2" x2="1200" y2="2" stroke="url(#steelLaser)" stroke-width="2" class="laser-line" filter="url(#laserGlow)" />

  <!-- Subtle Architectural Pillars -->
  <line x1="180" y1="2" x2="180" y2="22" stroke="#8fa0b0" stroke-width="1" opacity="0.25" />
  <line x1="420" y1="2" x2="420" y2="16" stroke="#8fa0b0" stroke-width="1" opacity="0.18" />
  <line x1="600" y1="2" x2="600" y2="26" stroke="#cdd5e0" stroke-width="1.2" opacity="0.35" />
  <line x1="780" y1="2" x2="780" y2="16" stroke="#8fa0b0" stroke-width="1" opacity="0.18" />
  <line x1="1020" y1="2" x2="1020" y2="22" stroke="#8fa0b0" stroke-width="1" opacity="0.25" />

  <!-- Central Evangelion Quote in Exact Palette -->
  <text x="600" y="50" fill="#cdd5e0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-style="italic" letter-spacing="0.5">
    &quot;Man fears the darkness, and so he scrapes away at the edges of it with fire. He creates life by diminishing the darkness.&quot;
  </text>
  <text x="600" y="73" fill="#8fa0b0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2.5">
    — NEON GENESIS EVANGELION —
  </text>
</svg>
