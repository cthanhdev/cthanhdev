<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 115" width="100%" height="115">
  <defs>
    <linearGradient id="specularFooter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="75%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="footerAmbient" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#2997FF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#2997FF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="115" fill="transparent" />

  <!-- Apple Frosted Glass Card Plate -->
  <rect x="10" y="6" width="880" height="103" rx="16" fill="#161618" stroke="#2C2C2E" stroke-width="1" />
  <rect x="10" y="6" width="880" height="103" rx="16" fill="url(#footerAmbient)" />

  <!-- Top Specular Catch Line -->
  <line x1="28" y1="7" x2="872" y2="7" stroke="url(#specularFooter)" stroke-width="1" stroke-linecap="round" />

  <!-- Decorative Subtle Quotation Glyph -->
  <text x="450" y="36" text-anchor="middle" fill="#2C2C2E" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', serif" font-size="32" font-weight="700">“</text>

  <!-- Quote Lines -->
  <text x="450" y="56" text-anchor="middle" fill="#F5F5F7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-style="italic" font-weight="400" letter-spacing="-0.2">
    &quot;Man fears the darkness, and so he scrapes away at the edges of it with fire.
  </text>
  <text x="450" y="76" text-anchor="middle" fill="#F5F5F7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-style="italic" font-weight="400" letter-spacing="-0.2">
    He creates life by diminishing the darkness.&quot;
  </text>

  <!-- Attribution Stamp -->
  <text x="450" y="96" text-anchor="middle" fill="#86868B" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.6">
    — NEON GENESIS EVANGELION • REFLECTION —
  </text>
</svg>
