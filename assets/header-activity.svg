<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 54" width="100%" height="54">
  <defs>
    <linearGradient id="specularActivity" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="20%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="80%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="appleGreenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .pulse-dot-activity {
        animation: applePulseGreen 3.2s ease-in-out infinite;
      }
      @keyframes applePulseGreen {
        0%, 100% { opacity: 0.7; transform: scale(0.95); }
        50% { opacity: 1; transform: scale(1.08); }
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse-dot-activity { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="54" fill="transparent" />

  <!-- Apple Frosted Glass Plate -->
  <rect x="10" y="6" width="880" height="42" rx="14" fill="#161618" stroke="#2C2C2E" stroke-width="1" />

  <!-- Top Specular Catch (Apple Material Reflection) -->
  <line x1="28" y1="7" x2="872" y2="7" stroke="url(#specularActivity)" stroke-width="1" stroke-linecap="round" />

  <!-- Left Accent Orb: Apple System Green (Live Pulse) -->
  <g transform="translate(28, 27)">
    <circle cx="0" cy="0" r="4" fill="#30D158" filter="url(#appleGreenGlow)" class="pulse-dot-activity" />
  </g>

  <!-- Category Eyebrow -->
  <text x="44" y="22" fill="#86868B" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" letter-spacing="1.8">TELEMETRY &amp; METRICS</text>

  <!-- Main Section Heading -->
  <text x="44" y="38" fill="#F5F5F7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" letter-spacing="-0.3">Activity &amp; Performance</text>

  <!-- Right Pill Badge: Apple Glass Capsule -->
  <g transform="translate(712, 15)">
    <rect width="160" height="24" rx="12" fill="#202024" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <circle cx="14" cy="12" r="3" fill="#30D158" />
    <text x="25" y="15.5" fill="#A1A1A6" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500">Live LeetCode Telemetry</text>
  </g>
</svg>
